<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Assets Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Lo and Behold! The GD Assets Gallery!!!</h1>
    <p id="status">Loading assets...</p>
  </header>
  <main>
    <div id="controls">
      <div class="control-row">
        <input id="filter" placeholder="Search..." />
        <select id="sort">
          <option value="name">Sort: Name</option>
          <option value="size-desc">Sort: Size (Large)</option>
          <option value="size-asc">Sort: Size (Small)</option>
          <option value="date-new">Sort: Newest</option>
          <option value="date-old">Sort: Oldest</option>
        </select>
        <span id="count">0 images</span>
      </div>
    </div>
    <div id="grid"></div>
  </main>
  <div id="lightbox" class="lightbox" style="display:none">
    <div class="lightbox-content">
      <span class="lightbox-close">×</span>
      <img id="lightbox-img" />
      <div class="lightbox-info">
        <p id="lightbox-name"></p>
        <p id="lightbox-size"></p>
      </div>
      <div class="lightbox-nav">
        <button id="lightbox-prev">‹ Prev</button>
        <button id="lightbox-next">Next ›</button>
      </div>
    </div>
  </div>
  <footer id="legal">
    <p>All assets and intellectual property belong to RobtopGames. This is an archival resource for organizational purposes only.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
